name: Lite quality checks

on:
  push:
  pull_request:
  schedule:
    - cron: "18 3 * * 1"
  workflow_dispatch:

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - name: Check out public Lite source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Lite dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile application
        run: python -m compileall doclira_lite run.py
      - name: Test public PDF operations
        run: python -m unittest discover -s tests -v
