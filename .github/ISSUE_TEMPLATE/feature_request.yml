name: Feature request
description: Suggest an improvement for Doclira PDF
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: workflow
    attributes:
      label: What document task are you trying to complete?
      description: Describe the real workflow rather than only the proposed button.
    validations:
      required: true
  - type: textarea
    id: current_problem
    attributes:
      label: What is difficult today?
    validations:
      required: true
  - type: textarea
    id: desired_result
    attributes:
      label: What result would help?
    validations:
      required: true
